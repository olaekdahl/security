# Linkerd micro-segmentation demo.
#
# Server selects the orders-api HTTP port. Once this Server exists, traffic to
# that pod/port is denied unless an AuthorizationPolicy allows it.
apiVersion: policy.linkerd.io/v1beta1
kind: Server
metadata:
  name: orders-api-http
  namespace: zt-demo
spec:
  podSelector:
    matchLabels:
      app: orders-api
  port: http
  proxyProtocol: "HTTP/1"
---
# Only the demo-client service account may call orders-api.
# bad-client can still get a valid app token, but its workload identity is not allowed.
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: allow-demo-client-to-orders-api
  namespace: zt-demo
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: orders-api-http
  requiredAuthenticationRefs:
    - kind: ServiceAccount
      name: demo-client
