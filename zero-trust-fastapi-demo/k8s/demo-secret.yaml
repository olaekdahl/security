# Demo only: Kubernetes Secrets are base64-encoded by default, not magically secure.
# This file exists to demonstrate "separate config/secrets from application code."
# Production systems should use enterprise secret management and rotation.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: zt-demo
type: Opaque
stringData:
  JWT_SECRET: "change-me-use-a-strong-256-bit-secret-in-real-systems"
  JWT_ISSUER: "demo-auth"
  JWT_AUDIENCE: "orders-api"
  JWT_TTL_SECONDS: "600"
